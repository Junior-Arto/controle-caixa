<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Caixa</title>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #e9eef3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 30, 0.15);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* cabeçalho */
        .header {
            background: #0b2b3f;
            color: white;
            padding: 1.6rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1e7e5c;
        }

        .header-left h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 i {
            color: #6fcf97;
            font-size: 2rem;
        }

        .header-left .cliente {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .saldo-box {
            background: #1e4b5e;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .saldo-box .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .saldo-box .valor {
            font-size: 1.7rem;
            font-weight: 700;
            background: #0b1e28;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #b9f3d9;
            transition: 0.2s;
        }

        .saldo-box .valor.negativo {
            color: #ffb3b3;
            background: #4a1e1e;
        }

        /* filtros e resumo */
        .toolbar {
            padding: 1.2rem 2rem;
            background: #f8fafc;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d0dde7;
            gap: 1rem;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filtros input, .filtros select {
            padding: 0.6rem 1rem;
            border: 1px solid #bdd3e0;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            outline: none;
            transition: 0.2s;
            min-width: 160px;
        }

        .filtros input:focus, .filtros select:focus {
            border-color: #1e7e5c;
            box-shadow: 0 0 0 3px rgba(30, 126, 92, 0.15);
        }

        .filtros button {
            background: #1e7e5c;
            border: none;
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #1e7e5c;
        }
        .filtros button:hover {
            background: #14634a;
        }

        .filtros button.limpar {
            background: transparent;
            color: #1e7e5c;
            border: 1px solid #bdd3e0;
        }

        .filtros button.limpar:hover {
            background: #e2edf5;
        }

        .resumo-badge {
            display: flex;
            gap: 24px;
            font-size: 0.95rem;
            background: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #cbdae5;
        }

        .resumo-badge span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .resumo-badge .credito i { color: #1e7e5c; }
        .resumo-badge .debito i { color: #b33a3a; }

        /* tabela */
        .tabela-wrapper {
            overflow-x: auto;
            padding: 0 1.5rem 1.5rem 1.5rem;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 1000px;
        }

        th {
            text-align: left;
            padding: 1rem 0.8rem 0.8rem 0.8rem;
            font-weight: 600;
            color: #1c3b4f;
            border-bottom: 2px solid #cbdae5;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        td {
            padding: 0.85rem 0.8rem;
            border-bottom: 1px solid #e2eef6;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f4faff;
        }

        .data-hora {
            font-weight: 500;
            color: #0b2b3f;
            white-space: nowrap;
        }

        .data-hora small {
            display: block;
            font-weight: 400;
            color: #5f7f92;
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .doc {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #466b80;
        }

        .historico {
            max-width: 280px;
            word-break: break-word;
            font-weight: 500;
            color: #12303f;
        }

        .historico small {
            font-weight: 400;
            color: #5f7f92;
            font-size: 0.7rem;
            display: block;
        }

        .favorecido {
            font-weight: 500;
            color: #1c3b4f;
        }

        .favorecido small {
            font-weight: 400;
            color: #5f7f92;
            font-size: 0.7rem;
            display: block;
        }

        .cpf {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #3b5e72;
            white-space: nowrap;
        }

        .valor {
            font-weight: 700;
            white-space: nowrap;
            text-align: right;
        }

        .valor.credito {
            color: #1a7a4e;
        }

        .valor.debito {
            color: #b33a3a;
        }

        .saldo-col {
            font-weight: 600;
            white-space: nowrap;
            text-align: right;
            color: #0a2a38;
        }

        .saldo-col small {
            font-weight: 400;
            color: #5f7f92;
            font-size: 0.7rem;
            display: block;
        }

        .tipo-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tipo-badge.credito {
            background: #d9f0e3;
            color: #0f5c3a;
        }

        .tipo-badge.debito {
            background: #fbe1e1;
            color: #9e2b2b;
        }

        .tipo-badge.saldo {
            background: #e2eef6;
            color: #1c5b7a;
        }

        .tipo-badge.juros {
            background: #fff2d6;
            color: #9b6f1d;
        }

        /* rodapé */
        .footer {
            padding: 1rem 2rem;
            background: #f8fafc;
            border-top: 1px solid #d0dde7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #3b5e72;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer .total-itens {
            font-weight: 500;
        }

        .footer .data-extrato {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sem-resultados {
            text-align: center;
            padding: 3rem !important;
            color: #6d8fa3;
            font-style: italic;
        }

        .sem-resultados i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        @media (max-width: 800px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .resumo-badge {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <div class="header">
            <div class="header-left">
                <h1>
                    <i class="fas fa-wallet"></i> 
                    Controle de Caixa
                </h1>
                <div class="cliente">
                    <i class="fas fa-user-circle"></i> 
                    TITULAR DA CONTA · Ag 0000 / CC 0000.0000000000-0
                </div>
            </div>
            <div class="saldo-box">
                <span class="label">Saldo atual</span>
                <span class="valor" id="saldoAtualDisplay">R$ 204,01</span>
            </div>
        </div>

        <!-- Barra de ferramentas / filtros -->
        <div class="toolbar">
            <div class="filtros">
                <input type="text" id="filtroTexto" placeholder="Buscar histórico, favorecido..." autocomplete="off">
                <select id="filtroTipo">
                    <option value="todos">Todos os tipos</option>
                    <option value="credito">Crédito (+)</option>
                    <option value="debito">Débito (-)</option>
                    <option value="saldo">Saldo dia</option>
                    <option value="juros">Juros/Correção</option>
                </select>
                <button id="btnLimparFiltros" class="limpar">
                    <i class="fas fa-eraser"></i> Limpar
                </button>
            </div>
            <div class="resumo-badge">
                <span class="credito"><i class="fas fa-arrow-up"></i> <span id="totalCreditos">R$ 0,00</span></span>
                <span class="debito"><i class="fas fa-arrow-down"></i> <span id="totalDebitos">R$ 0,00</span></span>
            </div>
        </div>

        <!-- Tabela de lançamentos -->
        <div class="tabela-wrapper">
            <table id="tabelaLancamentos">
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>Nr. Doc</th>
                        <th>Histórico</th>
                        <th>Favorecido</th>
                        <th>CPF/CNPJ</th>
                        <th>Tipo</th>
                        <th>Valor (R$)</th>
                        <th>Saldo (R$)</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- preenchido pelo JS -->
                </tbody>
            </table>
        </div>

        <!-- Rodapé -->
        <div class="footer">
            <div class="total-itens" id="totalItens">Exibindo 0 lançamentos</div>
            <div class="data-extrato">
                <i class="fas fa-calendar-alt"></i> Extrato: 09/10/2026 - 12:57
            </div>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------
        // Dados extraídos do extrato (com base no PDF)
        // ------------------------------------------------------------
        const lancamentos = [
            // 08/10/2026
            { data: '08/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 974.75, sinal: 'C' },
            { data: '08/10/2026', hora: '13:44:30', doc: '081344', historico: 'CRED PIX CHAVE', favorecido: 'Favorecido A', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 100.00, saldo: 974.75, sinal: 'C' },
            // 07/10/2026
            { data: '07/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 874.75, sinal: 'C' },
            { data: '07/10/2026', hora: '18:55:06', doc: '071855', historico: 'CRED PIX CHAVE', favorecido: 'Favorecido A', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 100.00, saldo: 874.75, sinal: 'C' },
            { data: '07/10/2026', hora: '15:00:07', doc: '071500', historico: 'CRED PIX CHAVE', favorecido: 'Favorecido A', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 100.00, saldo: 774.75, sinal: 'C' },
            // 06/10/2026
            { data: '06/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 674.75, sinal: 'C' },
            { data: '06/10/2026', hora: '17:40:33', doc: '061740', historico: 'CRED PIX CHAVE', favorecido: 'Favorecido B', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 80.00, saldo: 674.75, sinal: 'C' },
            // 05/10/2026
            { data: '05/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 594.75, sinal: 'C' },
            { data: '05/10/2026', hora: '19:49:52', doc: '051949', historico: 'CRED PIX CHAVE', favorecido: 'Favorecido C', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 140.00, saldo: 594.75, sinal: 'C' },
            // 02/10/2026
            { data: '02/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 454.75, sinal: 'C' },
            { data: '02/10/2026', hora: '20:07:31', doc: '022007', historico: 'DEB PIX INS MANUAL DADOS', favorecido: 'Titular (mesma conta)', cpf: '*.XXX.XXX*', tipo: 'debito', valor: 250.00, saldo: 454.75, sinal: 'C' },
            // 01/10/2026
            { data: '01/10/2026', hora: '00:00:00', doc: '000000', historico: 'SALDO DIA', favorecido: '', cpf: '', tipo: 'saldo', valor: 0, saldo: 704.75, sinal: 'C' },
            { data: '01/10/2026', hora: '18:42:38', doc: '011842', historico: 'DEB PIX CHAVE', favorecido: 'Favorecido D', cpf: '*.XXX.XXX*', tipo: 'debito', valor: 1500.00, saldo: 704.75, sinal: 'C' },
            { data: '01/10/2026', hora: '10:27:36', doc: '011027', historico: 'CRED PIX CHAVE', favorecido: 'Titular (mesma conta)', cpf: '*.XXX.XXX*', tipo: 'credito', valor: 2000.00, saldo: 2204.75, sinal: 'C' },
            { data: '01/10/2026', hora: '02:55:23', doc: '000000', historico: 'CREDITO JUROS', favorecido: '', cpf: '', tipo: 'juros', valor: 0.55, saldo: 204.75, sinal: 'C' },
            { data: '01/10/2026', hora: '02:55:23', doc: '000000', historico: 'CORRECAO MONETARIA', favorecido: '', cpf: '', tipo: 'juros', valor: 0.19, saldo: 204.20, sinal: 'C' }
        ];

        // ------------------------------------------------------------
        // Funções auxiliares
        // ------------------------------------------------------------
        function formatarValor(valor) {
            return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatarDataHora(dataStr, horaStr) {
            return `${dataStr} ${horaStr}`;
        }

        // Retorna a classe CSS para o tipo
        function getTipoInfo(tipo) {
            switch(tipo) {
                case 'credito': return { label: 'Crédito', classe: 'credito' };
                case 'debito': return { label: 'Débito', classe: 'debito' };
                case 'saldo': return { label: 'Saldo dia', classe: 'saldo' };
                case 'juros': return { label: 'Juros/Correção', classe: 'juros' };
                default: return { label: tipo, classe: '' };
            }
        }

        // ------------------------------------------------------------
        // Renderizar tabela com base nos filtros
        // ------------------------------------------------------------
        function renderizarTabela() {
            const filtroTexto = document.getElementById('filtroTexto').value.toLowerCase().trim();
            const filtroTipo = document.getElementById('filtroTipo').value;
            const tbody = document.getElementById('corpoTabela');

            // Filtrar dados
            const filtrados = lancamentos.filter(item => {
                // Filtro por tipo
                if (filtroTipo !== 'todos' && item.tipo !== filtroTipo) return false;

                // Filtro por texto (busca em historico, favorecido, cpf, doc)
                if (filtroTexto) {
                    const campos = [
                        item.historico || '',
                        item.favorecido || '',
                        item.cpf || '',
                        item.doc || '',
                        item.data || '',
                        item.hora || ''
                    ].join(' ').toLowerCase();
                    if (!campos.includes(filtroTexto)) return false;
                }
                return true;
            });

            // Calcular totais de crédito e débito (apenas lançamentos que não são saldo)
            let totalCreditos = 0;
            let totalDebitos = 0;
            filtrados.forEach(item => {
                if (item.tipo === 'credito') totalCreditos += item.valor;
                if (item.tipo === 'debito') totalDebitos += item.valor;
            });

            // Atualizar displays de totais
            document.getElementById('totalCreditos').textContent = `R$ ${formatarValor(totalCreditos)}`;
            document.getElementById('totalDebitos').textContent = `R$ ${formatarValor(totalDebitos)}`;

            // Contagem de itens
            document.getElementById('totalItens').textContent = `Exibindo ${filtrados.length} lançamento${filtrados.length !== 1 ? 's' : ''}`;

            // Se não houver resultados
            if (filtrados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="sem-resultados">
                            <i class="fas fa-search"></i><br>
                            Nenhum lançamento encontrado com os filtros atuais.
                        </td>
                    </tr>
                `;
                return;
            }

            // Construir linhas
            let html = '';
            filtrados.forEach(item => {
                const tipoInfo = getTipoInfo(item.tipo);
                const valorFormatado = formatarValor(item.valor);
                const saldoFormatado = formatarValor(item.saldo);
                const sinalSaldo = item.sinal || 'C';

                // Definir classe do valor: crédito ou débito (para débito mostramos "- R$")
                let valorClasse = '';
                let valorExibicao = '';
                if (item.tipo === 'credito' || item.tipo === 'juros') {
                    valorClasse = 'credito';
                    valorExibicao = `+ R$ ${valorFormatado}`;
                } else if (item.tipo === 'debito') {
                    valorClasse = 'debito';
                    valorExibicao = `- R$ ${valorFormatado}`;
                } else {
                    // saldo dia não tem valor, mostramos "--"
                    valorClasse = '';
                    valorExibicao = '—';
                }

                // Para o saldo dia, o valor é 0 e não mostramos como crédito/débito
                if (item.tipo === 'saldo') {
                    valorExibicao = '—';
                }

                // Formatar CPF (se existir)
                const cpfExibicao = item.cpf ? item.cpf : '—';

                // Favorecido (se vazio, mostra '—')
                const favorecidoExibicao = item.favorecido ? item.favorecido : '—';

                // Histórico complemento
                let historicoExibicao = item.historico;

                html += `
                    <tr>
                        <td class="data-hora">
                            ${item.data} <small>${item.hora}</small>
                        </td>
                        <td class="doc">${item.doc}</td>
                        <td class="historico">${historicoExibicao}</td>
                        <td class="favorecido">${favorecidoExibicao}</td>
                        <td class="cpf">${cpfExibicao}</td>
                        <td><span class="tipo-badge ${tipoInfo.classe}">${tipoInfo.label}</span></td>
                        <td class="valor ${valorClasse}">${valorExibicao}</td>
                        <td class="saldo-col">
                            R$ ${saldoFormatado} <small>${sinalSaldo}</small>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ------------------------------------------------------------
        // Atualizar saldo do cabeçalho (fixo conforme extrato)
        // ------------------------------------------------------------
        function atualizarSaldoCabecalho() {
            // Saldo final do extrato: 204,01 C
            const saldo = 204.01;
            const display = document.getElementById('saldoAtualDisplay');
            display.textContent = `R$ ${formatarValor(saldo)}`;
            display.classList.remove('negativo');
        }

        // ------------------------------------------------------------
        // Event listeners
        // ------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            // Render inicial
            renderizarTabela();
            atualizarSaldoCabecalho();

            // Filtros
            const filtroTexto = document.getElementById('filtroTexto');
            const filtroTipo = document.getElementById('filtroTipo');
            const btnLimpar = document.getElementById('btnLimparFiltros');

            filtroTexto.addEventListener('input', renderizarTabela);
            filtroTipo.addEventListener('change', renderizarTabela);

            btnLimpar.addEventListener('click', () => {
                filtroTexto.value = '';
                filtroTipo.value = 'todos';
                renderizarTabela();
            });
        });
    </script>
</body>
</html>
